<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شبِ سایه‌ها | مافیای سه‌بعدی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<style>
:root{

  --moon:#8da2e0; --paper:#efe4cf; --bone:#b8ab93;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit}

#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;

#hud > *{pointer-events:auto}
.chip{background:rgba(11,9,16,.72);border:1px solid rgba(226,169,75,.35);border-radius:999px;padding:5px 14px;
  font-weight:700;font-size:14px;backdrop-filter:blur(6px);color:var(--lamp)}
.chip[data-night="1"]{color:var(--moon);border-color:rgba(141,162,224,.4)}
.chip.btnlike{font-weight:600;color:var(--paper);cursor:pointer}
.chip.btnlike:focus-visible{outline:2px solid var(--moon)}
#hud .grp{display:flex;gap:8px}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  background:rgba(11,9,16,.74);border:1px solid rgba(226,169,75,.32);border-radius:999px;
  padding:1px 10px;font-size:12.5px;white-space:nowrap;display:flex;gap:6px;align-items:center;
  backdrop-filter:blur(4px);transition:border-color .2s,background .2s}
.tag.sel{border-color:var(--lamp);background:rgba(60,38,10,.85)}
.tag.gone{opacity:.55;text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.m{background:#e0475c}.dot.c{background:#58c47e}.dot.u{background:#9a9a9a}

#sheet{position:fixed;left:0;right:0;bottom:0;max-height:44vh;overflow:auto;display:none;z-index:6;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));

  border-top:1px solid rgba(226,169,75,.3);line-height:1.95;font-size:15px}
#sheet.on{display:block}
.msg p{margin:0 0 .55em}
.msg b{color:var(--lamp);font-weight:700}
.dim{color:var(--bone)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font-weight:600;font-size:15px;min-height:44px;padding:0 16px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(239,228,207,.28);background:rgba(239,228,207,.06);color:var(--paper);flex:1 1 auto}
.btn.primary{background:var(--lamp);color:#1a1006;border-color:var(--lamp)}
.btn.danger{background:var(--wine);border-color:var(--wine)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.cd:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.chipf{display:inline-block;padding:0 10px;border-radius:999px;background:rgba(239,228,207,.09);font-size:12.5px;margin:2px 0 2px 4px;line-height:1.9}
.say{border-inline-start:3px solid var(--lamp);padding:2px 12px;margin:.5em 0}
.cue{color:var(--bone);font-size:13.5px;margin:0}
.badge{font-size:12px;padding:0 8px;border-radius:999px;margin-inline-start:6px}
.badge.m{background:rgba(224,71,92,.2);color:#ff8d9c}
.badge.c{background:rgba(88,196,126,.18);color:#8fe3ad}
.badge.u{background:rgba(160,160,160,.2);color:#cfcfcf}
.badge.x{background:rgba(160,160,160,.2);color:#cfcfcf}

#modal{position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:14px;
  background:rgba(5,4,8,.88);backdrop-filter:blur(5px)}
#modal.on{display:grid}
#modal .card{width:100%;max-width:470px;max-height:86vh;overflow:auto;background:#15111c;
  border:1px solid rgba(226,169,75,.3);border-radius:14px;padding:18px;line-height:1.9}
.card h3{margin:0 0 6px;font-size:19px;color:var(--lamp)}
.card h4{margin:14px 0 4px;font-size:15px;color:var(--moon)}
.card ol{margin:0;padding-inline-start:20px}
.card ul{margin:6px 0;padding-inline-start:20px}
.guest{padding:8px 0;border-top:1px solid rgba(239,228,207,.1)}
.guest.gone{opacity:.55}
.note{font-size:13.5px;color:var(--bone);padding-inline-start:10px;border-inline-start:2px solid rgba(239,228,207,.2);margin-top:3px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.opts .btn{font-size:19px;min-height:54px}
.seq{font-size:26px;font-weight:800;text-align:center;direction:ltr;letter-spacing:.05em;color:var(--paper);margin:14px 0 4px}
.candles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 4px}
.cd{height:84px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:color-mix(in srgb,var(--c) 28%,#120e16);cursor:pointer;transition:background .12s,box-shadow .12s}
.cd.lit{background:var(--c);box-shadow:0 0 26px var(--c)}

#intro{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;
  padding:24px 22px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(8,6,12,.97) 38%,rgba(8,6,12,.35) 75%,rgba(8,6,12,.1))}
#intro.off{display:none}
#intro h1{font-size:clamp(46px,15vw,92px);line-height:1.15;margin:0 0 6px;font-weight:900;color:var(--paper);
  text-shadow:0 0 34px rgba(226,169,75,.45);animation:rise 1.6s ease-out both}
#intro .sub{font-size:18px;color:var(--lamp);font-weight:700;margin:0 0 10px}
#intro p{max-width:34em;margin:0 0 18px;line-height:2;color:var(--bone)}
@keyframes rise{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}

#end{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:14px;background:rgba(5,4,8,.82);backdrop-filter:blur(4px)}
#end.on{display:grid}
#end .card{width:100%;max-width:470px;max-height:90vh;overflow:auto;background:#15111c;border:1px solid rgba(226,169,75,.35);border-radius:14px;padding:20px;line-height:1.9}
#end h2{margin:0 0 4px;font-size:30px}
#end h2.win{color:#8fe3ad}#end h2.lose{color:#ff8d9c}
#flash{position:fixed;inset:0;background:#dbe3ff;opacity:0;pointer-events:none;z-index:7}
#flash.go{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:.85}12%{opacity:.1}22%{opacity:.6}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#intro h1{animation:none}#flash.go{animation:none}}

#bubbles{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:230px;background:#efe4cf;color:#1a1006;
  border-radius:14px;padding:7px 12px;font-size:13px;line-height:1.7;box-shadow:0 6px 22px rgba(0,0,0,.5);animation:pop .22s ease-out}
.bub::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#efe4cf}
@keyframes pop{from{opacity:0;transform:translate(-50%,-92%) scale(.92)}to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.btn.ghost{width:100%;flex:1 1 100%;background:transparent}
.btn.link{display:flex;align-items:center;justify-content:center;text-decoration:none}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}
</style>
</head>

  t.anisotropy=4; return t;
}

function buildChar(c){
  const g=new THREE.Group(), f=c.feat, mats=[];
  const M=(color,r=.8)=>{ const m=new THREE.MeshStandardMaterial({color,roughness:r}); mats.push(m); return m; };
  const upper=new THREE.Group(); upper.position.y=.62; g.add(upper); const arms=[];
  const coat=M(COATS[f.coat].hex);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.4,.52,1.2,14),coat); body.position.y=.6; upper.add(body);
  const sh=new THREE.Mesh(new THREE.SphereGeometry(.46,14,10),coat); sh.scale.set(1.05,.5,.7); sh.position.y=1.15; upper.add(sh);
  const skin=M(f.skin,.7), hairM=M(f.hair,.9);
  const head=new THREE.Group(); head.position.y=1.3; upper.add(head);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.11,.13,.22,10),skin); neck.position.y=.02; head.add(neck);
  const hm=new THREE.Mesh(new THREE.SphereGeometry(.29,20,16),skin); hm.position.y=.3; head.add(hm);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(.04,8,8),skin); nose.position.set(0,.28,.29); head.add(nose);
  const eyeM=new THREE.MeshStandardMaterial({color:0x0b0b0b,roughness:.3}); const eyes=[];
  for(const s of [-1,1]){ const e=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eyeM); e.position.set(s*.1,.34,.265); head.add(e); eyes.push(e);
    const br=new THREE.Mesh(new THREE.BoxGeometry(.09,.016,.016),hairM); br.position.set(s*.1,.42,.272); br.rotation.z=-s*.15; head.add(br); }
  const cap=new THREE.Mesh(new THREE.SphereGeometry(.305,18,12,0,Math.PI*2,0,Math.PI*.52),hairM); cap.position.y=.3; cap.rotation.x=-.35; head.add(cap);
  if(f.long){ const lh=new THREE.Mesh(new THREE.CylinderGeometry(.28,.3,.58,14),hairM); lh.position.set(0,.06,-.1); head.add(lh); }
  if(f.hat){
    const hc=M(HATC[c.id%3],.8);
    const brim=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.03,22),hc); brim.position.y=.5; head.add(brim);
    const crown=new THREE.Mesh(new THREE.CylinderGeometry(.26,.3,.27,18),hc); crown.position.y=.64; head.add(crown);
    const band=new THREE.Mesh(new THREE.CylinderGeometry(.305,.305,.05,18),M(0x7a2433)); band.position.y=.54; head.add(band);
  }
  if(f.glasses){
    const gm=new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.3,metalness:.5});
    for(const s of [-1,1]){ const r=new THREE.Mesh(new THREE.TorusGeometry(.07,.013,8,18),gm); r.position.set(s*.105,.34,.272); head.add(r); }
    const br=new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,.07,6),gm); br.rotation.z=Math.PI/2; br.position.set(0,.35,.278); head.add(br);
  }
  if(f.scarf){
    const sm=M(SCARFC[c.id%3],.95);
    const t=new THREE.Mesh(new THREE.TorusGeometry(.3,.1,10,20),sm); t.rotation.x=Math.PI/2; t.position.y=1.26; upper.add(t);
    const tail=new THREE.Mesh(new THREE.BoxGeometry(.15,.5,.05),sm); tail.position.set(.12,1.0,.42); tail.rotation.x=.18; upper.add(tail);
  }
  for(const s of [-1,1]){
    const arm=new THREE.Group(); arm.position.set(s*.5,1.12,.04); arm.rotation.x=-.9; arm.rotation.z=s*.1;
    const ag=new THREE.CylinderGeometry(.09,.1,.9,10); ag.translate(0,-.45,0);
    arm.add(new THREE.Mesh(ag,coat));
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.1,10,8),skin); hand.position.y=-.93; arm.add(hand); upper.add(arm); arms.push(arm);
  }
  const ring=new THREE.Mesh(new THREE.RingGeometry(.72,.86,40),new THREE.MeshBasicMaterial({color:0xe2a94b,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.04; g.add(ring);
  const sc=f.tall?1.12:1; g.scale.setScalar(sc);
  g.position.set(Math.sin(c.theta)*R_CHAR,0,Math.cos(c.theta)*R_CHAR); g.lookAt(0,0,0);
  g.traverse(o=>{ if(o.isMesh && o!==ring){ o.castShadow=true; o.receiveShadow=true; } o.userData.cid=c.id; });
  scene.add(g);
  Object.assign(c,{group:g,upper,head,eyes,mats,coat,ring,sc,arms,eyeS:1,speak:0,vis:1});
}
function greyOut(c){
  const hsl={};
  c.mats.forEach(m=>{ m.color.getHSL(hsl); m.color.setHSL(hsl.h,hsl.s*.2,hsl.l*.7); });
}

function toneMenu(c,type){
  sheetSet(`<p><b>${c.name}</b> منتظر است. با چه لحنی بپرسی؟</p><p class="dim">لحن تند ممکن است آدم‌ها را دست‌پاچه کند، ولی اعتمادشان را می‌سوزاند و زودجوش‌ها را عصبانی می‌کند. لحن همدلانه آدم‌ها را بازتر می‌کند. کسانی که به تو اعتماد دارند، در رأی‌گیری از تو پیروی می‌کنند.</p>`,[

function ask(c,type,tone){
  G.q--; if(type==='a') c.asked.a=true; else c.asked.s=true;
  const hard=tone==='hard', p=c.p; let speech='',cue='',skipTrust=false;
  if(hard&&c.ptrust<25){
    speech='حرفی با تو ندارم. برو سراغ یکی دیگر.'; cue='رویش را برمی‌گرداند.'; c.ptrust-=6; skipTrust=true; setFx(c,'shake',1.6);
  } else if(Math.random()<(hard?.1+p.temper*.8:p.temper*.1)){
    speech=say(c,'angry'); cue='صورتش سرخ شده و صدایش بالا رفته.'; c.ptrust-=hard?15:6; skipTrust=true; c.angry=2.5; setFx(c,'shake',1.8);
  } else if(type==='a'){
    const nerv=Math.random()<nervProb(c,tone);
    speech=say(c,nerv?'nerv':'calm'); if(!hard&&c.ptrust>=55) speech=say(c,'warm')+' '+speech;
    cue=pick(nerv?CUE_N:CUE_C); if(nerv) c.nerv=4;
  } else {
    const t=c.suspect!=null?byId(c.suspect):null;
    if(t&&t.state==='alive'){
      speech=say(c,'accuse',{t:t.name});
      const lt=G.clues[G.clues.length-1], test=lt&&TESTS.find(x=>x.id===lt.testId);
      if(!hard){ speech+=' '+((test&&test.f(t)===lt.pol&&Math.random()<.7)?`شاهد گفت مهاجم ${lt.text}؛ ${t.name} هم با این توصیف جور درمی‌آید.`:pick(REASONS)); }
      const nerv=Math.random()<nervProb(c,tone)*.7; cue=pick(nerv?CUE_N:CUE_C); if(nerv) c.nerv=3;
    } else { speech='هنوز مطمئن نیستم. شاید باید دوباره فکر کنم.'; cue=pick(CUE_C); }
  }
  if(!skipTrust) c.ptrust+=hard?-12:8;
  c.ptrust=clamp(c.ptrust,0,100);
  G.gaze={speaker:c.id,player:true,until:performance.now()+7000};
  showBubble(c,speech,7000); c.speak=clamp(speech.length*.06,2,6);
  c.notes.push(`روز ${FA(G.night)}، ${type==='a'?'دربارهٔ دیشب':'دربارهٔ مظنون'} (${hard?'تند':'همدلانه'}): «${speech}» — ${cue}`);
  sheetSet(`<p><b>${c.name}</b> <span class="dim">(${hard?'لحن تند':'لحن همدلانه'})</span></p><div class="say">«${speech}»</div><p class="cue">${cue}</p><p class="dim">پرسش‌های باقی‌مانده: ${FA(G.q)}</p>`,[{t:'بازگشت',k:'primary',fn:()=>openCard(c)}]);
}

function roleReveal(c){ return c.role==='mafia'?'او مافیا بود.':c.role==='doctor'?'او دکتر بود؛ بی‌گناه.':'او یک شهروند عادی بود.'; }
function killChar(c){
  c.state='dead'; greyOut(c);
  const cd=makeCandle(.22); cd.position.set(Math.sin(c.theta)*1.55,1.205,Math.cos(c.theta)*1.55); scene.add(cd); c.candle=cd;
  refreshTag(c);
}
function makeClue(shooter){
  const pool=aliveNPC(), cands=TESTS.map(t=>{ const pol=t.f(shooter); return {t,pol,n:pool.filter(c=>t.f(c)===pol).length}; });
  let good=cands.filter(x=>x.n>=1&&x.n<=4&&x.n<pool.length);
  if(!good.length) good=cands.filter(x=>x.n<pool.length);
  if(!good.length) good=cands;
  const x=pick(good);
  return {testId:x.t.id,pol:x.pol,text:x.pol?x.t.pos:x.t.neg,night:G.night};
}
function check(){
  const am=aliveNPC().filter(c=>c.role==='mafia').length;
  const others=aliveNPC().filter(c=>c.role!=='mafia').length+(G.player.alive?1:0);
  if(!G.player.alive) return 'dead';
  if(am===0) return 'win';
  if(am>=others) return 'lose';
  return null;
}
function dawn(){
  closeModal(); clearSel(); focusOverview(); G.phase='dawn';
  const shooter=pick(aliveNPC().filter(c=>c.role==='mafia'));
  const pool=aliveNPC().filter(c=>c.role!=='mafia').map(c=>c.id); if(G.night>1) pool.push('P');
  const victim=pick(pool);
  const doc=G.chars.find(c=>c.role==='doctor'&&c.state==='alive');
  const saved=doc?pick(aliveNPC().map(c=>c.id).concat('P')):null;
  const survived=victim===saved;
  setMood(0); setChip('صبحِ روز '+FA(G.night),false); boom();
  let s1, v=null;
  if(survived){ s1='<p>در تاریکی صدای شلیک آمد، اما صبح همه نفس می‌کشند. کسی از مرگ برگردانده شده است.</p>'; aliveNPC().forEach(c=>setFx(c,'gasp',1.4)); }
  else if(victim==='P'){ G.player.alive=false; return endGame('dead'); }
  else {
    v=byId(victim); killChar(v); s1=`<p>صبح شد. <b>${v.name}</b> روی میز افتاده و دیگر نفس نمی‌کشد. ${roleReveal(v)}</p>`;
    aliveNPC().forEach(c=>setFx(c,G.rel[c.id][v.id]>=65?'grief':'gasp',2.6));
    G.gaze={speaker:v.id,until:performance.now()+3800};
  }
  const res=check(); if(res) return endGame(res,s1);
  const clue=makeClue(shooter); G.clues.push(clue);
  G.morning=`${s1}<p>شاهد: «مهاجم ${clue.text}.»</p>`;
  G.q=3; G.chars.forEach(c=>c.asked={a:false,s:false});
  computeSuspects();
  sheetSet(s1,[{t:'شاهد را بشنو',k:'primary',fn:()=>{
    sheetSet(`<p>شاهدی که از پشت پنجره بود می‌گوید:</p><div class="say">«مهاجم ${clue.text}.»</div><p class="dim">این را با ظاهر میهمانان مقایسه کن. در دفترچه ثبت شد.</p>`,
      [{t:'به گفتگوی میز گوش بده',k:'primary',fn:()=>startTalk(buildTalk(v,clue),dayMain)}]);
  }}]);
}
function computeSuspects(){
  const al=aliveNPC(), lt=G.clues[G.clues.length-1];
  const test=lt?TESTS.find(t=>t.id===lt.testId):null;
  const matches=o=>test?test.f(o)===lt.pol:false;
  const nonM=al.filter(o=>o.role!=='mafia');
  const common=nonM.length?wpick(nonM,o=>1+(matches(o)?.5:0)):null;
  al.forEach(c=>{
    const others=al.filter(o=>o!==c); if(!others.length){ c.suspect=null; return; }
    const dis=o=>1.4-G.rel[c.id][o.id]/100;
    if(c.role==='mafia'){
      if(common&&common!==c&&Math.random()<.75) c.suspect=common.id;
      else c.suspect=wpick(others,o=>(o.role==='mafia'?.05:1)*dis(o)).id;
    } else c.suspect=wpick(others,o=>(1+(o.role==='mafia'?.9:0)+(matches(o)?.7:0))*dis(o)).id;
  });
}

  sheetSet('<div id="tl"></div>',[{t:'رد کردن گفتگو',fn:()=>{ skip=true; }}]);
  const tl=sheet.querySelector('#tl');
  const render=L=>L.narr?`<p class="dim">${L.text}</p>`:`<p><b>${byId(L.who).name}:</b> «${L.text}»${L.cue?`<br><span class="cue">${L.cue}</span>`:''}</p>`;
  const wait=async ms=>{ const t0=performance.now(); while(performance.now()-t0<ms&&!skip&&G.talkId===my) await sleep(80); };
  (async()=>{
    for(const L of lines){
      if(skip||G.talkId!==my) break;
      tl.insertAdjacentHTML('beforeend',render(L)); sheet.scrollTop=sheet.scrollHeight;
      if(!L.narr) speakLine(L);
      await wait(Math.max(2300,L.text.length*62));
    }
    if(G.talkId!==my) return;
    hideBubble(); G.gaze=null;
    const html=lines.map(render).join('');
    G.talkLog.push(html);
    sheetSet(html,[{t:'ادامه',k:'primary',fn:done}]);
  })();
}
function buildTalk(v,clue){
  const al=shuffle(aliveNPC()), L=[];
  const a=al[0];
  L.push({who:a.id,text:v?say(a,'grief',{v:v.name}):pick(['شکر خدا کسی کشته نشد؛ ولی یکی از ما هدف بود، این را فراموش نکنید.','عجیب است که امروز سالم بیدار شدیم... خدا کند ادامه پیدا کند.'])});
  const b=al.find(x=>x!==a)||a;
  L.push({who:b.id,text:say(b,'clue',{x:clue.text})});
  const cand=al.filter(x=>x.suspect!=null&&byId(x.suspect).state==='alive');
  if(cand.length){
    const acc=wpick(cand,x=>.4+x.p.temper+(x.role==='mafia'?.3:0)), tg=byId(acc.suspect);
    const nv=Math.random()<nervProb(acc,'neutral')*.6;
    L.push({who:acc.id,text:say(acc,'accuse',{t:tg.name}),at:tg.id,nerv:nv,cue:nv?pick(CUE_N):null});
    const tn=Math.random()<nervProb(tg,'neutral');
    L.push({who:tg.id,text:say(tg,'defend'),at:acc.id,nerv:tn,cue:tn?pick(CUE_N):pick(CUE_C)});
    G.rel[tg.id][acc.id]=Math.max(0,G.rel[tg.id][acc.id]-15);
    const sup=al.find(x=>x!==acc&&x!==tg&&((G.rel[x.id][tg.id]>=65&&Math.random()<.7)||(x.role==='mafia'&&tg.role==='mafia'&&Math.random()<.4)));
    if(sup) L.push({who:sup.id,text:pick([`${tg.name} را من می‌شناسم؛ اهل این کارها نیست.`,`این اتهام به ${tg.name} بی‌انصافی است.`,`بس کنید؛ ${tg.name} این کار را نمی‌کند.`]),at:acc.id});
    else { const ag=al.find(x=>x!==acc&&x!==tg&&x.suspect===tg.id); if(ag) L.push({who:ag.id,text:`من هم با ${acc.name} موافقم؛ ${tg.name} باید توضیح بدهد.`,at:tg.id}); }
  }
  return L;
}

function showVote(){

function resolveVote(pv){
  const al=aliveNPC(), tally={}; let followers=0;
  al.forEach(c=>{
    let t=c.suspect;
    if(c.role!=='mafia'&&pv!=null&&pv!==c.id&&c.ptrust>=65&&Math.random()<.55){ t=pv; followers++; }
    else if(t==null||byId(t).state!=='alive'||(c.role!=='mafia'&&Math.random()<.12)) t=pick(al.filter(o=>o!==c)).id;
    tally[t]=(tally[t]||0)+1;
  });
  if(pv!=null) tally[pv]=(tally[pv]||0)+2;
  const arr=Object.entries(tally).map(([k,v])=>({id:+k,v})).sort((x,y)=>y.v-x.v);
  const top=arr.filter(x=>x.v===arr[0].v), tie=top.length>1, out=byId(pick(top).id);
  const lines=[];
  lines.push({narr:true,text:arr.map(x=>`${byId(x.id).name}: ${FA(x.v)} رأی`).join('، ')+'.'+(tie?' رأی‌ها مساوی شد و قرعه افتاد.':'')});
  if(followers>0) lines.push({narr:true,text:`${FA(followers)} نفر به قضاوت تو اعتماد کردند و همراهت رأی دادند.`});
  lines.push({who:out.id,text:say(out,'farewell'),cue:pick(out.role==='mafia'?CUE_C:CUE_N),at:null});
  lines.push({narr:true,text:`${out.name} از میز کنار گذاشته شد. ${roleReveal(out)}`});
  const rest=al.filter(o=>o!==out), friend=rest.find(o=>G.rel[o.id][out.id]>=65);
  if(out.role==='mafia'){
    const a=pick(rest); lines.push({who:a.id,text:pick(['پس درست حدس زده بودیم!','خدا را شکر. یکی‌شان کمتر شد.','دیدید؟ گفتم یک جای کار می‌لنگد.'])});
    if(friend&&friend!==a) lines.push({who:friend.id,text:pick(['باورم نمی‌شود... من او را آدم دیگری می‌دانستم.','چقدر راحت گول خوردم...'])});
  } else {
    const a=friend||pick(rest); lines.push({who:a.id,text:pick(['دیدید؟! یک آدم بی‌گناه را از ترس بیرون کردیم.','این اشتباه بود. به خدا این یک اشتباه بود.','چه کرده‌ایم...'])});
  }
  setFx(out,'shake',4);
  rest.forEach(c=>setFx(c,G.rel[c.id][out.id]>=65?'grief':'gasp',3));
  startTalk(lines,()=>{
    out.state='out'; refreshTag(out); hideBubble();
    G.chars.forEach(c=>{ if(c.state==='alive') c.ptrust=clamp(c.ptrust+(out.role==='mafia'?10:-10),0,100); });
    const res=check(); if(res) return endGame(res,'');
    sheetSet('<p class="dim">عمارت در سکوتی سنگین فرو می‌رود. شب نزدیک است.</p>',[{t:'شب فرا می‌رسد',k:'primary',fn:()=>{ G.night++; beginNight(); }}]);
  },'votetalk');
}

function startPuzzle(c){
  const kind=pick(['seq','riddle','candles']);
  const card=modal(`<h3>قفل پروندهٔ ${c.name}</h3><div id="pz"></div>`), pz=card.querySelector('#pz');
  let live=true; const done=ok=>{ live=false; closeModal(); puzzleResult(c,ok); };
  const optsUI=(opts,right,html)=>{
    pz.innerHTML=html+'<div class="opts"></div>';
    const box=pz.querySelector('.opts');
    shuffle(opts).forEach(o=>{ const b=document.createElement('button'); b.type='button'; b.className='btn'; b.textContent=typeof o==='number'?FA(o):o; if(typeof o!=='number') b.style.fontSize='16px'; b.onclick=()=>done(o===right); box.appendChild(b); });
  };
  if(kind==='seq'){
    const gens=[
      ()=>{ const a=rnd(2,9),d=rnd(2,7); return {s:[a,a+d,a+2*d,a+3*d],ans:a+4*d}; },
      ()=>{ const a=rnd(1,4); return {s:[a,a*2,a*4,a*8],ans:a*16}; },
      ()=>{ const a=rnd(1,5); return {s:[a,a+1,a+3,a+6],ans:a+10}; },
      ()=>({s:[1,4,9,16],ans:25})
    ];
    const g=pick(gens)(); const set=new Set([g.ans]); while(set.size<3) set.add(g.ans+rnd(-4,4)||g.ans+5);
    optsUI([...set],g.ans,`<p>عدد بعدیِ الگو کدام است؟</p><div class="seq">${g.s.map(FA).join(' ، ')} ، ؟</div>`);
  } else if(kind==='riddle'){
    const bank=[
      ['هرچه بیشتر از آن برداری، بزرگ‌تر می‌شود. چیست؟','چاله',['کوه','دریا']],
      ['پر از سوراخ است، ولی آب را نگه می‌دارد.','اسفنج',['الک','سبد']],
      ['دست دارد، اما نمی‌تواند دست بدهد.','ساعت',['دستکش','در']],
      ['هرچه بیشتر خشک می‌کند، خودش خیس‌تر می‌شود.','حوله',['آفتاب','نان']],
      ['شب‌ها بی‌دعوت می‌آیند و صبح بی‌خداحافظی می‌روند.','ستاره‌ها',['رؤیاها','سایه‌ها']]
    ];
    const r=pick(bank); optsUI([r[1],...r[2]],r[1],`<p>${r[0]}</p>`);
  } else {
    const cols=['#c0392b','#e2a94b','#3f7fbf','#4a9a62'], seq=Array.from({length:4},()=>rnd(0,3));
    pz.innerHTML=`<p>شمع‌ها به ترتیبی روشن می‌شوند. همان ترتیب را تکرار کن.</p>
      <div class="candles">${cols.map((c,i)=>`<button type="button" class="cd" data-i="${i}" style="--c:${c}" aria-label="شمع ${FA(i+1)}"></button>`).join('')}</div>
      <div class="row"><button class="btn" id="rp" type="button">نمایش دوباره (یک‌بار)</button></div>`;
    const btns=[...pz.querySelectorAll('.cd')]; let step=0,locked=true,replays=1;
    const flash=async(i,ms)=>{ btns[i].classList.add('lit'); await sleep(ms); btns[i].classList.remove('lit'); };
    const play=async()=>{ locked=true; step=0; await sleep(500); for(const i of seq){ if(!live) return; await flash(i,520); await sleep(220); } locked=false; };
    btns.forEach((b,i)=>b.onclick=async()=>{ if(locked||!live) return; flash(i,200); if(i!==seq[step]) return done(false); step++; if(step===seq.length) { await sleep(250); done(true); } });
    pz.querySelector('#rp').onclick=e=>{ if(replays<=0||locked) return; replays--; e.target.disabled=true; play(); };
    play();
  }
}

let drag=null; const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false}; canvas.setPointerCapture(e.pointerId); });

/* ============ حلقهٔ رندر ============ */
const clock=new THREE.Clock(), v3=new THREE.Vector3(), v3c=new THREE.Vector3();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  moodCur+=(moodT-moodCur)*Math.min(1,dt*1.6);
  if(!reduce&&moodCur>.7&&Math.random()<dt*.1) ltn=Math.max(ltn,.8);
  ltn*=Math.pow(.02,dt); if(ltn<.01) ltn=0; flick=Math.max(0,flick-dt*.7); shake=Math.max(0,shake-dt*1.4);
  applyMood(moodCur,t);

  if(introSpin) cam.t.az=Math.sin(t*.18)*.7;
  const k=Math.min(1,dt*3.2);
  cam.az+=angDiff(cam.az,cam.t.az)*k;
  for(const p of ['el','dist','tx','ty','tz']) cam[p]+=(cam.t[p]-cam[p])*k;
  const ce=Math.cos(cam.el), sx=(Math.random()-.5)*shake*.12, sy=(Math.random()-.5)*shake*.12;
  camera.position.set(cam.tx+cam.dist*Math.sin(cam.az)*ce+sx,cam.ty+cam.dist*Math.sin(cam.el)+sy,cam.tz+cam.dist*Math.cos(cam.az)*ce);
  camera.lookAt(cam.tx,cam.ty,cam.tz);
  viewOffT=sheet.classList.contains('on')?sheet.offsetHeight*.5:(introSpin?H*.18:0);
  viewOff+=(viewOffT-viewOff)*Math.min(1,dt*5);
  camera.setViewOffset(W,H,0,Math.round(viewOff),W,H);

  lampG.rotation.z=Math.sin(t*.7)*.012; lampG.rotation.x=Math.cos(t*.5)*.01;
  const fs=1+Math.sin(t*14)*.12+Math.random()*.1;
  centerCandle.userData.flame.scale.set(fs,1.7*fs,fs);
  for(let i=0;i<DN;i++){ dpos[i*3+1]+=dt*.08; dpos[i*3]+=Math.sin(t*.4+i)*dt*.02; if(dpos[i*3+1]>5.2) dpos[i*3+1]=.5; }
  dgeo.attributes.position.needsUpdate=true;

  if(G){
    const night=moodCur>.5, now=performance.now();
    if(G.gaze&&G.gaze.until&&now>G.gaze.until) G.gaze=null;
    G.chars.forEach(c=>{
      const u=c.upper, alive=c.state==='alive';
      let lean=alive?(night?.3:Math.sin(t*1.1+c.id)*.015):.8;
      let hx=alive?(night?.35:Math.sin(t*.8+c.id*2)*.03):.55, hy=0, hz=0;
      if(alive&&!night) hy=Math.sin(t*.35+c.id*1.7)*.22;
      if(alive&&!night&&G.gaze){
        const sp=byId(G.gaze.speaker); let has=false;
        if(c.id===G.gaze.speaker){
          if(G.gaze.player){ v3c.copy(camera.position); has=true; }
          else if(G.gaze.at!=null){ byId(G.gaze.at).head.getWorldPosition(v3c); has=true; }
        } else if(sp){ sp.head.getWorldPosition(v3c); has=true; }
        if(has){ const loc=u.worldToLocal(v3c); hy=clamp(Math.atan2(loc.x,loc.z),-1.1,1.1); }
      }
      if(c.fx.t>0){
        c.fx.t-=dt;
        switch(c.fx.type){
          case 'gasp': lean-=.22; hx-=.2; break;
          case 'grief': lean+=.3; hx+=.45; break;
          case 'shake': hy+=Math.sin(t*16)*.35; break;
          case 'flinch': lean-=.12; hx-=.08; hz+=Math.sin(t*20)*.03; break;
        }
      }
      if(c.speak>0){ c.speak-=dt; hx+=Math.sin(t*11)*.05; hy+=Math.sin(t*3)*.08; }
      if(c.nerv>0){ c.nerv-=dt; hz+=Math.sin(t*30)*.025; hx+=Math.sin(t*26)*.02; }
      if(c.angry>0) c.angry-=dt;
      const k2=Math.min(1,dt*3);
      u.rotation.x+=(lean-u.rotation.x)*Math.min(1,dt*2.5);
      c.head.rotation.x+=(hx-c.head.rotation.x)*k2; c.head.rotation.y+=(hy-c.head.rotation.y)*k2; c.head.rotation.z=hz;
      if(alive&&c.arms){
        c.arms.forEach((a,i)=>{
          let rx=-.9, rz=(i?1:-1)*.1;
          if(c.speak>0&&!night) rx-=(.35+.35*Math.sin(t*5+i*1.7+c.id))*(i===0?.9:.55);
          if(c.angry>0) rx-=.5;
          if(c.nerv>0){ rx+=Math.sin(t*38+i*2)*.04; rz+=Math.sin(t*33+i)*.03; }
          a.rotation.x+=(rx-a.rotation.x)*Math.min(1,dt*8); a.rotation.z=rz;
        });
      }
      const es=alive&&!night?1:.12; c.eyeS+=(es-c.eyeS)*Math.min(1,dt*6); c.eyes.forEach(e=>e.scale.y=c.eyeS);
      if(c.state==='out'){ c.vis=Math.max(0,c.vis-dt*.9); c.group.scale.setScalar(Math.max(.001,c.sc*c.vis)); c.group.visible=c.vis>.02; }
      if(c.ring.material.opacity>0&&G.sel===c.id) c.ring.material.opacity=.6+Math.sin(t*4)*.25;
      if(c.candle){ const f=c.candle.userData.flame, s2=1+Math.sin(t*13+c.id)*.15+Math.random()*.08; f.scale.set(s2,1.7*s2,s2); }
      c.head.getWorldPosition(v3); v3.y+=.62; v3.project(camera);
      const show=v3.z<1&&c.vis>.3&&G.phase!=='intro';
      c.tag.style.display=show?'flex':'none';
      if(show){ c.tag.style.left=((v3.x*.5+.5)*W)+'px'; c.tag.style.top=((-v3.y*.5+.5)*H)+'px'; }
    });
    if(bubble){
      bubble.c.head.getWorldPosition(v3); v3.y+=.62; v3.project(camera);
      if(v3.z<1){ bubble.el.style.display='block'; bubble.el.style.left=clamp((v3.x*.5+.5)*W,125,W-125)+'px'; bubble.el.style.top=((-v3.y*.5+.5)*H-30)+'px'; }
      else bubble.el.style.display='none';
    }
  }
  renderer.render(scene,camera);
}

/* راه‌اندازی */
resize(); newGame(); G.phase='intro'; G.chars.forEach(c=>c.tag.style.display='none');
cam.az=cam.t.az=0; cam.dist=cam.t.dist=overviewDist(); setMood(1); moodCur=.6;
$('#phaseChip').textContent='آماده';
frame();
})();
